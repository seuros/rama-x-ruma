# rama × ruma: serve ruma's typed Matrix API endpoints on rama HTTP.

[package]
name = "rama-x-ruma"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader <terminale@gmail.com>"]
description = "Serve ruma's typed Matrix API endpoints on rama: a request extractor, response conversion, Matrix errcodes, auth plumbing and endpoint routing"
license = "BSD-3-Clause"
repository = "https://github.com/seuros/rama-x-ruma"
readme = "README.md"
keywords = ["matrix", "ruma", "rama", "http", "server"]
categories = ["network-programming", "web-programming::http-server"]

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "rama_x_ruma"

[features]
default = []
# Simplified sliding sync (MSC4186): `MatrixRejection::UnknownPos` reports
# ruma's `ErrorKind::UnknownPos` instead of `ErrorKind::Unknown`.
unstable-msc4186 = ["ruma/unstable-msc4186"]

[dependencies]
# ruma parses requests from, and renders responses into, `http` crate types.
http = { version = "1.3" }
rama = { version = "0.4.0", features = ["http", "http-hyperium", "net"] }
ruma = { version = "0.17.2", features = ["api", "client-api-s"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[dev-dependencies]
rama = { version = "0.4.0", features = ["http-full"] }
ruma = { version = "0.17.2", features = ["federation-api-s"] }
tokio = { version = "1.42", features = ["full"] }
